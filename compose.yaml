x-fx-tape: &fx-tape
  image: ib-gbp-tracker:${IMAGE_TAG:-local}
  build:
    context: .
    target: runtime
  depends_on:
    db:
      condition: service_healthy
  environment: &fx-tape-environment
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fx_tape}:${POSTGRES_PASSWORD:-fx_tape_local}@db:5432/${POSTGRES_DB:-fx_tape}
    DATA_PROVIDER: ${DATA_PROVIDER:-demo}
    IB_HOST: ${IB_DOCKER_HOST:-host.docker.internal}
    IB_PORT: ${IB_PORT:-4002}
    IB_CLIENT_ID: ${IB_CLIENT_ID:-21}
    IB_BACKFILL_CLIENT_ID: ${IB_BACKFILL_CLIENT_ID:-22}
    IB_TIMEOUT_SECONDS: ${IB_TIMEOUT_SECONDS:-12}
    FX_PAIR: ${FX_PAIR:-GBPUSD}
    BAR_SIZE: ${BAR_SIZE:-1 min}
    HISTORY_DURATION: ${HISTORY_DURATION:-1 D}
    SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-60}
    SYNC_ON_STARTUP: ${SYNC_ON_STARTUP:-true}
    SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
    BACKFILL_START: ${BACKFILL_START:-2017-01-01}
    BACKFILL_REQUEST_DELAY_SECONDS: ${BACKFILL_REQUEST_DELAY_SECONDS:-10}
    BACKFILL_MAX_RETRIES: ${BACKFILL_MAX_RETRIES:-3}
    BACKFILL_RETRY_DELAY_SECONDS: ${BACKFILL_RETRY_DELAY_SECONDS:-30}
  extra_hosts:
    - host.docker.internal:host-gateway
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s

services:
  app:
    <<: *fx-tape
    ports:
      - ${APP_PORT:-8000}:8000
    restart: unless-stopped

  backfill:
    <<: *fx-tape
    profiles:
      - backfill
    command:
      - fx-tape
      - backfill
      - run
    healthcheck:
      disable: true
    restart: "no"

  db:
    image: postgres:17.9-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fx_tape}
      POSTGRES_USER: ${POSTGRES_USER:-fx_tape}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fx_tape_local}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - fx_tape_postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  fx_tape_postgres:
